<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Code Atlas · Admin</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="admin-shell"><h1>Operator console</h1><p>Manage access codes and stop work that is still extracting.</p><form id="login"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><section id="controls" hidden><h2>Access codes</h2><button id="mint">Mint access code</button><output id="new-code" aria-live="polite"></output><ul id="codes"></ul><h2>Pending extractions</h2><p>Stopping a pending job deletes its temporary snapshot and prevents the review from becoming available.</p><ul id="pending"></ul></section><p id="status" role="status"></p></main><script type="module" src="./src/admin.js"></script></body></html>
